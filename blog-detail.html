<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog · UPSC Test Series</title></head><body><main style="max-width:900px;margin:60px auto;padding:24px;font-family:Arial,sans-serif"><a href="blog.html">← Back to Blog</a><div id="post"><h1>Loading…</h1></div></main><script src="api-client.js"></script><script>(async()=>{const slug=new URLSearchParams(location.search).get('slug');const el=document.getElementById('post');try{const r=await UPSC_API.get('/public/blog/'+encodeURIComponent(slug));el.innerHTML=`<small>${r.category||'UPSC'} · ${r.author||''}</small><h1>${r.title}</h1><p>${r.excerpt||''}</p><article>${r.content||''}</article>`}catch(e){el.innerHTML='<h1>Post not found</h1>'}})();</script></body></html>
