<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | UPSC Test Series</title><style>body{margin:0;background:#f6f8fb;font-family:Inter,system-ui,sans-serif;color:#18212b;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px;box-shadow:0 14px 40px rgba(16,36,62,.08)}h1{margin:8px 0;color:#10243e}.muted{color:#667085;font-size:13px}.field{margin:14px 0}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #e5e7eb;border-radius:9px;box-sizing:border-box;font:inherit}.btn{width:100%;padding:11px;border:0;border-radius:9px;background:#1d5fa7;color:#fff;font-weight:900;cursor:pointer}.notice{margin-top:12px;font-size:12px;display:none}.notice.show{display:block}.back{display:block;margin-top:16px;color:#1d5fa7;font-size:12px;text-align:center}</style></head><body><section class="card"><div style="font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#1d5fa7">UPSC Test Series</div><h1>Admin Portal</h1><p class="muted">Sign in with an authorised admin account.</p><form id="f"><div class="field"><label>Email or Mobile</label><input id="identifier" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn">Sign in</button></form><div id="n" class="notice"></div><a class="back" href="index.html">← Return to public website</a></section><script src="api-client.js"></script><script>(async()=>{if(localStorage.getItem('upsc_access_token')){try{const u=await UPSC_API.get('/auth/me');if(['admin','super_admin','content_manager','evaluator','finance','support'].includes(u.role))location.href='admin-dashboard.html';}catch(_){}}})();document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const n=document.getElementById('n');n.textContent='Signing in…';n.className='notice show';try{const d=await UPSC_API.post('/auth/login',{identifier:document.getElementById('identifier').value.trim(),password:document.getElementById('password').value});if(!['admin','super_admin','content_manager','evaluator','finance','support'].includes(d.user.role))throw new Error('This account is not authorised for admin access.');UPSC_API.setSession(d);location.href='admin-dashboard.html';}catch(err){n.textContent=err.message;n.className='notice show';}});</script></body></html>
