<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — UPSC Test Series</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f5f7fa;color:#172b4d;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(440px,calc(100% - 32px));background:#fff;border:1px solid #dde3ea;border-radius:18px;padding:32px;box-shadow:0 16px 50px rgba(16,36,62,.08)}h1{margin:0 0 8px;font-size:28px}.field{display:grid;gap:7px;margin:18px 0}.field label{font-size:12px;font-weight:800}.field input{padding:13px;border:1px solid #d6dbe1;border-radius:10px;font-size:15px;width:100%;box-sizing:border-box}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:#1d5fa7;color:white;font-weight:800;cursor:pointer}.brand{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#1d5fa7;margin-bottom:22px}.notice{margin-top:14px;padding:11px;border-radius:10px;font-size:12px;background:#eef4fb;color:#164d89}.notice.error{background:#fff1f0;color:#b42318}.link{display:block;text-align:center;margin-top:16px;color:#1d5fa7;font-weight:800;font-size:13px}</style></head><body><main class="card"><div class="brand">UPSC TEST SERIES</div><h1>Reset password</h1><p>Choose a new password for your account.</p><div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password"></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password"></div><button class="btn" id="reset">Update password</button><a class="link" href="login.html">Back to login</a><div id="notice" class="notice" hidden></div></main><script src="api-client.js"></script><script>(async()=>{const token=new URLSearchParams(location.search).get('token');const notice=document.getElementById('notice');function show(t,e=false){notice.textContent=t;notice.hidden=false;notice.className='notice'+(e?' error':'')}if(!token){show('Missing reset token.',true);return}document.getElementById('reset').onclick=async()=>{const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm)return show('Passwords do not match.',true);try{await UPSC_API.post('/auth/reset-password',{reset_token:token,new_password:password});show('Password updated. Redirecting to login…');setTimeout(()=>location.href='login.html',800)}catch(e){show(e.message,true)}}})();</script></body></html>
