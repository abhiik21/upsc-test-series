<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Reset Code — UPSC Test Series</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f5f7fa;color:#172b4d;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(440px,calc(100% - 32px));background:#fff;border:1px solid #dde3ea;border-radius:18px;padding:32px;box-shadow:0 16px 50px rgba(16,36,62,.08)}h1{margin:0 0 8px;font-size:28px}p{color:#667085;font-size:14px;line-height:1.6}.field{display:grid;gap:7px;margin:18px 0}.field label{font-size:12px;font-weight:800}.field input{padding:13px;border:1px solid #d6dbe1;border-radius:10px;font-size:18px;letter-spacing:.3em;text-align:center}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:#1d5fa7;color:white;font-weight:800;cursor:pointer}.brand{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#1d5fa7;margin-bottom:22px}.notice{margin-top:14px;padding:11px;border-radius:10px;font-size:12px;background:#eef4fb;color:#164d89}.notice.error{background:#fff1f0;color:#b42318}</style></head><body><main class="card"><div class="brand">UPSC TEST SERIES</div><h1>Verify reset code</h1><p>Enter the 6-digit code sent to your registered email.</p><div class="field"><label for="code">Verification code</label><input id="code" maxlength="6" inputmode="numeric" autocomplete="one-time-code"></div><button class="btn" id="verify">Continue</button><div id="notice" class="notice" hidden></div></main><script src="api-client.js"></script><script>(()=>{const qs=new URLSearchParams(location.search),identifier=qs.get('identifier')||'',notice=document.getElementById('notice');function show(t,e=false){notice.textContent=t;notice.hidden=false;notice.className='notice'+(e?' error':'')}document.getElementById('verify').onclick=async()=>{try{const r=await UPSC_API.post('/auth/verify-otp',{identifier,purpose:'password_reset',code:document.getElementById('code').value.trim()});location.href='reset-password.html?token='+encodeURIComponent(r.reset_token)}catch(e){show(e.message,true)}}})();</script></body></html>
