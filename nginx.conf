server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;
  server_tokens off;

  # The whole project folder is mounted as the web root, so keep everything that is not a web page private:
  # the backend source, configuration, databases, uploaded files and the project documents.
  location ~ ^/(backend|deployment)(/|$) { return 404; }
  location ~ /\.                         { return 404; }
  location = /robots.txt                { try_files $uri =404; }
  location ~* \.(py|pyc|sql|md|ya?ml|env|db|sqlite3?|log|ini|toml|zip|txt|example|conf|tmp)$ { return 404; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health/ {
    proxy_pass http://api:8000/health/;
    proxy_set_header Host $host;
  }

  location = /health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
