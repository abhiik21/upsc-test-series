<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Current Affairs Article · UPSC Test Series</title><link rel="stylesheet" href="index.html"></head><body><main style="max-width:900px;margin:60px auto;padding:24px;font-family:Arial,sans-serif"><a href="current-affairs.html">← Back to Current Affairs</a><div id="article"><h1>Loading…</h1></div></main><script src="api-client.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get('id');const el=document.getElementById('article');try{const r=await UPSC_API.get('/public/current-affairs/'+encodeURIComponent(id));el.innerHTML=`<small>${r.category} · ${r.gs||'UPSC'}</small><h1>${r.title}</h1><p>${r.summary}</p><h3>Key points</h3><p>${r.content||r.key_points||''}</p>`}catch(e){el.innerHTML='<h1>Article not found</h1>'}})();</script></body></html>
